name: Build daily HR slate

# Free daily updates via GitHub Actions. Commits a fresh data/latest.json the
# site (GitHub Pages) reads. Runs are in UTC.
on:
  schedule:
    # Multiple runs (UTC) so the slate rolls to the new day and re-pulls as
    # probable pitchers + lineups firm up. ET = UTC-4 (summer).
    - cron: "30 13 * * *"   # ~9:30am ET — new day, early probables
    - cron: "30 16 * * *"   # ~12:30pm ET
    - cron: "30 19 * * *"   # ~3:30pm ET
    - cron: "30 22 * * *"   # ~6:30pm ET — lineups for night games
  workflow_dispatch: {}        # lets you trigger a build manually

permissions:
  contents: write              # to commit the regenerated JSON

concurrency:                   # don't let overlapping runs fight over a push
  group: daily-hr-slate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Persist the Statcast daily cache between runs so we only pull the new day
      # (first run fetches ~21 days, ~2 min; later runs are fast). No pip needed.
      - name: Cache Statcast pulls
        uses: actions/cache@v4
        with:
          path: data/cache/statcast
          # v2.6: bumped to -v2- to drop the poisoned cache (empty files written
          # while Savant was 403ing, before cache validation existed).
          key: statcast-v2-${{ github.run_id }}
          restore-keys: statcast-v2-

      - name: Build today's slate JSON
        run: python3 build.py

      # v2.7 — grade the last ~30 settled slates so the site's Results panel
      # stays current. Uses committed dated snapshots + git history of
      # latest.json for the pick record, and the free MLB Stats API (cached in
      # data/cache/results) for actual HR/TB outcomes. Non-fatal if it hiccups.
      - name: Backtest recent slates
        run: python3 backtest.py --days 30 || echo "backtest step skipped (non-fatal)"

      - name: Commit updated data
        run: |
          git config user.name  "hr-bot"
          git config user.email "hr-bot@users.noreply.github.com"
          # v2.7 — also persist the dated snapshot (the backtest record), the
          # graded results, and the results cache. build.py writes a dated
          # picks-YYYY-MM-DD.json every run; committing it means the model's
          # own history is preserved instead of living only in latest.json.
          git add data/latest.json data/picks-*.json data/backtest.json data/cache/results 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit (slate unchanged)."
          else
            git commit -m "Daily HR slate $(date -u +%F\ %H:%MZ)"
            # rebase in case the repo advanced since checkout, then push
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
